<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in the Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      cursor: pointer;
    }

    /* 16:9 Aspect Ratio Box */
    .aspect-ratio-box {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh;
      max-height: 56.25vw;
      overflow: visible;
    }

    /* Black border overlay to prevent subpixel bleed and act as margin */
    .aspect-ratio-box::after {
      content: '';
      position: absolute;
      top: -15px;
      left: -15px;
      right: -15px;
      bottom: -15px;
      border: 20px solid #000000;
      pointer-events: none;
      z-index: 10;
    }

    /* Screen container */
    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    /* Tiled texture background container */
    .texture-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('12ToneTexture.svg');
      background-repeat: repeat;
      background-size: 500px 500px;
      z-index: 1;
      animation: moveDiagonal 60s linear infinite;
    }

    /* SVG cutout mask overlay */
    .mask-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* SVG image element inside mask overlay */
    .mask-svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* CSS Keyframes for seamless tiling translation */
    @keyframes moveDiagonal {
      0% {
        background-position: 0px 0px;
      }
      100% {
        background-position: 500px 500px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="aspect-ratio-box">
      <!-- Scrolling background texture -->
      <div class="texture-background"></div>

      <!-- Center mask graphic overlay -->
      <div class="mask-overlay">
        <img class="mask-svg" src="Artboard 1.svg" alt="404 Page Mask">
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
